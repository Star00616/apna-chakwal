<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Chakwal Pros - Zila Chakwal Service Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Apna Chakwal Pros</h1>
  <p>Zila Chakwal ke Har Kaam ke Mahir Afraad aur Dukaanein</p>
  <button class="add-btn" onclick="openModal()">+ Apna Kaam / Shop Register Karein</button>
</header>

<div class="filters">
  <input type="text" id="searchInput" placeholder="Kaam, dukaan ya ilaka search karein..." onkeyup="filterPros()">
  <select id="tehsilFilter" onchange="filterPros()">
    <option value="All">Tamam Tehsils (Zila Chakwal)</option>
    <option value="Chakwal City">Chakwal City</option>
    <option value="Kallar Kahar">Kallar Kahar</option>
    <option value="Choa Saidan Shah">Choa Saidan Shah</option>
    <option value="Talagang">Talagang</option>
    <option value="Lawa">Lawa</option>
  </select>
  <select id="serviceTypeFilter" onchange="filterPros()">
    <option value="All">Shop aur Home Service (Dono)</option>
    <option value="Ghar Aa Kar Kaam (Home Service)">Ghar Aa Kar Kaam (Door-to-Door)</option>
    <option value="Shop / Dukaan">Shop / Dukaan</option>
    <option value="Shop + Home Service">Shop + Home Service (Dono)</option>
  </select>
  <select id="categoryFilter" onchange="filterPros()">
    <option value="All">Tamam Categories (All Professions)</option>
    <option value="Electrician & Solar">Electrician & Solar</option>
    <option value="Plumber & Sanitary">Plumber & Sanitary</option>
    <option value="Mistri & Labour (Mazdoor)">Mistri & Labour (Mazdoor)</option>
    <option value="Carpenter (Tarkhan)">Carpenter (Tarkhan)</option>
    <option value="Painter & Interior">Painter & Interior</option>
    <option value="AC, Fridge & Washing Machine">AC, Fridge & Washing Machine</option>
    <option value="Mobile & Laptop Repairing">Mobile & Laptop Repairing</option>
    <option value="Car & Bike Mechanic">Car & Bike Mechanic</option>
    <option value="Welder & Steel Works">Welder & Steel Works</option>
    <option value="Tailor (Darzi)">Tailor (Darzi)</option>
    <option value="Doctor, Clinic & Medical">Doctor, Clinic & Medical</option>
    <option value="Home Tutor & Academy">Home Tutor & Academy</option>
    <option value="Photographer & Videographer">Photographer & Videographer</option>
    <option value="Catering & Events">Catering & Events</option>
    <option value="Rent a Car & Transport">Rent a Car & Transport</option>
    <option value="Web, Graphic & Digital">Web, Graphic & Digital</option>
    <option value="Beauty Parlor & Salon">Beauty Parlor & Salon</option>
    <option value="Property & Real Estate">Property & Real Estate</option>
  </select>
</div>

<div class="container" id="prosContainer"></div>

<!-- Add / Edit Modal -->
<div class="modal" id="registerModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle">Apni Profile / Shop Register Karein</h3>
    <form id="proForm" onsubmit="saveProfessional(event)">
      <input type="hidden" id="editIndex" value="-1">
      <input type="text" id="proName" required placeholder="Aapka Naam ya Dukaan ka Naam">
      
      <select id="proCategory" required>
        <option value="Electrician & Solar">Electrician & Solar</option>
        <option value="Plumber & Sanitary">Plumber & Sanitary</option>
        <option value="Mistri & Labour (Mazdoor)">Mistri & Labour (Mazdoor)</option>
        <option value="Carpenter (Tarkhan)">Carpenter (Tarkhan)</option>
        <option value="Painter & Interior">Painter & Interior</option>
        <option value="AC, Fridge & Washing Machine">AC, Fridge & Washing Machine</option>
        <option value="Mobile & Laptop Repairing">Mobile & Laptop Repairing</option>
        <option value="Car & Bike Mechanic">Car & Bike Mechanic</option>
        <option value="Welder & Steel Works">Welder & Steel Works</option>
        <option value="Tailor (Darzi)">Tailor (Darzi)</option>
        <option value="Doctor, Clinic & Medical">Doctor, Clinic & Medical</option>
        <option value="Home Tutor & Academy">Home Tutor & Academy</option>
        <option value="Photographer & Videographer">Photographer & Videographer</option>
        <option value="Catering & Events">Catering & Events</option>
        <option value="Rent a Car & Transport">Rent a Car & Transport</option>
        <option value="Web, Graphic & Digital">Web, Graphic & Digital</option>
        <option value="Beauty Parlor & Salon">Beauty Parlor & Salon</option>
        <option value="Property & Real Estate">Property & Real Estate</option>
      </select>

      <select id="proTehsil" required>
        <option value="Chakwal City">Chakwal City</option>
        <option value="Kallar Kahar">Kallar Kahar</option>
        <option value="Choa Saidan Shah">Choa Saidan Shah</option>
        <option value="Talagang">Talagang</option>
        <option value="Lawa">Lawa</option>
      </select>

      <select id="proServiceType" required>
        <option value="Ghar Aa Kar Kaam (Home Service)">Ghar Aa Kar Kaam (Door-to-Door)</option>
        <option value="Shop / Dukaan">Shop / Dukaan Hai</option>
        <option value="Shop + Home Service">Shop + Home Service (Dono)</option>
      </select>

      <input type="text" id="proLocation" required placeholder="Shop Address ya Ilaka (e.g. Main Bazaar Kallar Kahar)">
      <input type="number" id="proPhone" required placeholder="WhatsApp Number: 923001234567">
      <textarea id="proDesc" rows="2" required placeholder="Apne kaam aur timing ki tafseel..."></textarea>
      
      <label style="font-size:12px; font-weight:bold;">1. Profile Photo ya Shop ki Tasveer (DP):</label>
      <input type="file" id="proAvatar" accept="image/*">
      
      <label style="font-size:12px; font-weight:bold;">2. Apne Kaam ki Photos ya Videos (1 se zyada select kar sakte hain):</label>
      <input type="file" id="proMedia" accept="image/*,video/*" multiple>
      
      <button type="submit" class="submit-btn" id="submitBtn">Profile Live Karein</button>
    </form>
  </div>
</div>

<!-- Portfolio Gallery Modal -->
<div class="modal" id="galleryModal">
  <div class="modal-content" style="max-width:650px;">
    <span class="close" onclick="closeGallery()">&times;</span>
    <h3 id="galleryTitle" style="margin-bottom:5px; color:#198754;">Kaam ki Gallery</h3>
    <p id="gallerySubtitle" style="font-size:12px; color:#666; margin-bottom:15px;"></p>
    <div id="galleryItems" class="gallery-grid"></div>
  </div>
</div>

<!-- Reviews Modal -->
<div class="modal" id="reviewModal">
  <div class="modal-content">
    <span class="close" onclick="closeReviews()">&times;</span>
    <h3 id="reviewTitle" style="color:#198754; margin-bottom:10px;">Customer Reviews</h3>
    
    <form id="reviewForm" onsubmit="submitReview(event)" style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:15px;">
      <input type="hidden" id="reviewProIndex">
      <input type="text" id="reviewerName" required placeholder="Aapka Naam">
      <select id="reviewStars" required>
        <option value="5">⭐⭐⭐⭐⭐ (5 - Zabardast Kaam)</option>
        <option value="4">⭐⭐⭐⭐ (4 - Acha Kaam)</option>
        <option value="3">⭐⭐⭐ (3 - Theek Thaak)</option>
        <option value="2">⭐⭐ (2 - Munasib Nahi)</option>
        <option value="1">⭐ (1 - Kharab Tajurba)</option>
      </select>
      <textarea id="reviewComment" rows="2" required placeholder="Inke kaam ke baray mein apni raye likhein..."></textarea>
      <button type="submit" class="submit-btn" style="background:#ffc107; color:#000;">Review Post Karein</button>
    </form>

    <div id="reviewsList" class="reviews-list"></div>
  </div>
</div>

<footer onclick="enableAdmin()" style="text-align:center; padding:25px 10px; color:#888; font-size:12px; cursor:pointer;">
  © Apna Chakwal Pros - Zila Chakwal
</footer>

<script src="script.js"></script>
</body>
</html>
